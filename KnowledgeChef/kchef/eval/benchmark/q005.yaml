id: Q005
question: "이번 달 매출은 얼마야?"
difficulty: medium
ambiguity_type: implicit_constraint

schema_context: |
  customers(id, name, email, phone, grade, point_balance, is_active, created_at)
  products(id, name, brand, sku, price, cost_price, stock_qty, is_active, created_at)
  orders(id, order_number, customer_id, status, total_amount, ordered_at)
  order_items(id, order_id, product_id, quantity, unit_price, subtotal)

expected_ir:
  intent: AGGREGATE
  concepts: [Order, Revenue]
  steps:
    - type: data
      source: orders
      filters:
        - field: ordered_at
          operator: LIKE
          value: "2026-06%"
        - field: status
          operator: IN
          value: [confirmed, delivered, shipped]
      aggregation:
        function: SUM
        field: total_amount
  output_structure:
    total_revenue: number
    period: string
  ambiguity_resolutions_expected:
    - element: "이번 달"
      selected: "2026-06"
    - element: "매출"
      selected: "status_not_cancelled"
