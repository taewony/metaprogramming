# ActiveGraph Text-to-SQL Agent System Model v00
#
# Experiment overview
# -------------------
# This file is the baseline, observed system model for the current
# Text-to-SQL agent implementation. Treat it as an experiment notebook plus a
# declarative system description: update it incrementally whenever a behavior,
# CLI command, data source, event type, object type, relation, or runtime policy
# changes.
#
# The current experiment goal is not to build a general agent framework in one
# step. The goal is to make ActiveGraph behavior visible and testable through a
# small, deterministic Text-to-SQL agent:
#
#   user prompt -> question event -> behavior chain -> graph projection -> answer
#
# Each experiment should preserve three observability loops:
#
#   1. CLI loop: run a prompt, inspect the latest or previous run.
#   2. Event loop: inspect event order and behavior failures from SQLite logs.
#   3. Graph loop: inspect projected objects and relations after replay.
#
# v00 is intentionally deterministic and LLM-free. It is the control baseline
# before adding LLM adapters, pack generation, OKF/KB integration, or broader
# system-model-to-agent synthesis.

schema_version: system-model.v00
kind: activegraph.agent.system_model
name: hospital-text-to-sql-agent
status: experimental_baseline
last_updated: "2026-07-10"
language: ko-en

summary:
  one_liner: "Behavior-backed Korean hospital Text-to-SQL agent for ActiveGraph runtime experiments."
  purpose: >-
    Provide a small, inspectable agent that demonstrates how external user input
    becomes an ActiveGraph event, how behaviors project internal graph objects
    and relations, and how CLI inspection can guide incremental behavior
    improvement.
  current_scope:
    - Korean natural-language queries over the hospital SQLite fixture.
    - Deterministic prompt-to-SQL behavior rules.
    - SQLite event-store backed run logging.
    - CLI and REPL inspection of before/after graph state.
  out_of_scope_v00:
    - LLM planner dependency.
    - LlamaIndex dependency.
    - Pack generation.
    - SKILL.md generation.
    - OKF knowledge-base writes.
    - Multi-agent orchestration.

experiment_protocol:
  principle: "Small observable increments over large opaque rewrites."
  loop:
    - step: define_case
      description: "Add or identify one user prompt, expected SQL, rows, and answer behavior."
    - step: run
      description: "Use agent.py REPL or direct CLI to execute the prompt."
    - step: inspect
      description: "Use text-to-sql inspect 0|-1|-2|<run_id> to inspect event/graph outcomes."
    - step: diagnose
      description: "If failure occurs, locate behavior.failed and the graph state at failure."
    - step: adapt
      description: "Change one behavior or rule, then re-run eval."
    - step: record
      description: "Update this system model when the behavior surface changes."
  recommended_commands:
    start_repl: "python activegraph/text-to-sql-agent/agent.py"
    ask_direct: "python activegraph/text-to-sql-agent/agent.py text-to-sql ask \"의사는 모두 몇명이야?\""
    inspect_latest: "python activegraph/text-to-sql-agent/agent.py text-to-sql inspect 0"
    inspect_previous: "python activegraph/text-to-sql-agent/agent.py text-to-sql inspect -1"
    eval: "python activegraph/text-to-sql-agent/agent.py text-to-sql eval"

source_layout:
  agent_entrypoint: "activegraph/text-to-sql-agent/agent.py"
  activegraph_runtime_src: "activegraph/text-to-sql-agent/src"
  text_to_sql_cli_module: "activegraph/text-to-sql-agent/src/cli/text_to_sql.py"
  activegraph_cli_main: "activegraph/text-to-sql-agent/src/cli/main.py"
  hospital_db: "activegraph/data/hospital.db"
  event_store: "activegraph/data/text_to_sql_events.sqlite"
  eval_cases: "activegraph/text-to-sql-agent/evals/hospital_cases.jsonl"
  run_artifacts_dir: "activegraph/text-to-sql-agent/.tests/runs"
  db_builder_script: "activegraph/text-to-sql-agent/scripts/build_hospital_db.py"
  db_verifier_script: "activegraph/text-to-sql-agent/scripts/verify_hospital_db.py"

runtime:
  package_resolution:
    mechanism: "agent.py inserts ./src at sys.path[0]."
    purpose: "Reverse-engineering should use copied local ActiveGraph source, not globally installed activegraph."
  graph:
    creation: "A fresh Graph() is created per text-to-sql ask/eval case."
    run_id: "Generated by ActiveGraph Graph id generator."
    initial_state:
      objects: []
      relations: []
      events: []
  activegraph_runtime:
    class: "activegraph.Runtime"
    construction:
      behaviors: "make_hospital_behaviors(db_file)"
      budget:
        max_events: 100
        max_behavior_calls: 20
      persist_to: "activegraph/data/text_to_sql_events.sqlite"
    idle_condition: "Runtime runs until event queue is idle, then emits runtime.idle."
  persistence:
    type: sqlite_event_store
    default_file: "activegraph/data/text_to_sql_events.sqlite"
    store_url: "sqlite:///D:/code/metaprogramming/KnowledgeChef/activegraph/data/text_to_sql_events.sqlite"
    note: "SQLite WAL sidecar files may appear during writes."
  artifacts:
    trace_jsonl: ".tests/runs/<run_id>/trace.jsonl"
    graph_snapshot: ".tests/runs/<run_id>/graph.json"
    note: "Artifacts are convenient local snapshots; SQLite event store is the replayable source of truth."

cli:
  entrypoint:
    file: "activegraph/text-to-sql-agent/agent.py"
    direct_mode: "If argv is present, delegate to activegraph.cli.main."
    repl_mode: "If no argv is present, start a small mode-aware REPL."
  repl:
    default_mode: text-to-sql
    modes:
      - name: text-to-sql
        prefix: ["text-to-sql"]
        description: "Short commands for Text-to-SQL experiments."
      - name: activegraph
        prefix: []
        description: "Original root ActiveGraph CLI command tree."
    commands:
      - command: help
        behavior: "Print current mode help; `help <command>` prints command help."
      - command: mode
        behavior: "Print modes; `mode text-to-sql` or `mode activegraph` switches modes."
      - command: exit
        aliases: [quit, q, ":q"]
        behavior: "Exit REPL."
    examples:
      - "help"
      - "ask \"의사는 모두 몇명이야?\""
      - "inspect 0"
      - "mode activegraph"
      - "help inspect"
  text_to_sql_commands:
    ask:
      usage: "text-to-sql ask <prompt>"
      repl_usage: "ask <prompt>"
      effect: "Run one prompt through the behavior pipeline and persist event log."
    eval:
      usage: "text-to-sql eval"
      repl_usage: "eval"
      effect: "Run JSONL eval cases; currently expected 2 passed, 0 failed."
    inspect:
      usage: "text-to-sql inspect [0|-1|-2|<run_id>]"
      repl_usage: "inspect [0|-1|-2|<run_id>]"
      effect: "Inspect before behaviors, after graph projection, recent events, and failures."
      selectors:
        "0": "latest run"
        "-1": "previous run"
        "-2": "two runs back"
        literal_run_id: "exact run lookup"
    repl:
      usage: "text-to-sql repl"
      effect: "Older command-specific hospital Text-to-SQL REPL; agent.py REPL is now preferred."
  activegraph_root_commands_visible_in_activegraph_mode:
    - diff
    - export-trace
    - fork
    - inspect
    - migrate
    - pack
    - quickstart
    - replay
    - text-to-sql

external_environment:
  database:
    type: sqlite
    path: "activegraph/data/hospital.db"
    role: "Read-only hospital fixture queried by execute_sql behavior."
  event_store:
    type: sqlite
    path: "activegraph/data/text_to_sql_events.sqlite"
    role: "ActiveGraph event log for replay, inspect, export-trace, and text-to-sql inspect."
  environment_variables:
    currently_required: []
    recommended_for_windows_korean_pipes:
      PYTHONIOENCODING: utf-8
    python_runtime_flags:
      PYTHONDONTWRITEBYTECODE: "1 recommended in this sandbox to avoid pyc write issues."

input_model:
  accepted_input:
    type: user_prompt
    language: ko
    examples:
      supported:
        - "의사는 모두 몇명이야?"
        - "의사는 모두 몇 명이야?"
        - "김지훈 의사의 전공은 뭐야?"
      known_failure:
        - "의사는 모두 몇명?"
  normalization:
    function: normalize_prompt_text
    purpose: "Repair selected Windows stdin mojibake/surrogate cases before matching."

planning_model:
  current_planner: deterministic_rule_planner
  implementation: deterministic_plan
  llm_dependency: false
  llamaindex_dependency: false
  rules:
    - id: doctor_specialty_by_name
      match: "Prompt contains 김지훈 and either 전공 or 전문."
      intent:
        kind: lookup
        entity: doctor
        filters:
          name: 김지훈
        requested_fields: [specialty]
      sql: "SELECT specialty FROM doctors WHERE name = ?"
      params: ["김지훈"]
      answer_template: "김지훈 의사의 전공은 {value}입니다."
    - id: doctor_count
      match_markers:
        - "의사는 모두 몇명이야"
        - "의사는 모두 몇 명이야"
        - "의사 모두 몇명이야"
        - "의사 모두 몇 명이야"
        - "의사 몇명"
        - "의사 몇 명"
      intent:
        kind: count
        entity: doctor
        filters: {}
        requested_fields: [count]
      sql: "SELECT COUNT(*) FROM doctors"
      params: []
      answer_template: "의사는 모두 {value}명입니다."
  failure_policy:
    unsupported_prompt: "Raise UnsupportedPromptError; runtime records behavior.failed."
    unsafe_sql: "Raise UnsafeSQLError if SQL is not a single safe SELECT."

behavior_model:
  registration_source: make_hospital_behaviors
  behaviors:
    - name: parse_intent
      kind: Behavior
      on: [question.submitted]
      creates: [question, intent]
      reads:
        event_payload: [prompt, language]
      emits: [intent.created]
      relations_created:
        - source: intent
          target: question
          type: derived_from
      failure_examples:
        - exception_type: UnsupportedPromptError
          cause: "deterministic_plan has no matching prompt rule."
    - name: compile_sql
      kind: Behavior
      on: [intent.created]
      creates: [sql_query]
      validates:
        - validate_select_sql
      emits: [sql.generated]
      relations_created:
        - source: sql_query
          target: intent
          type: derived_from
    - name: execute_sql
      kind: Behavior
      on: [sql.generated]
      creates: [query_result]
      external_reads:
        - "activegraph/data/hospital.db"
      emits: [sql.executed]
      patches:
        - object_type: sql_query
          patch:
            status: executed
      relations_created:
        - source: sql_query
          target: query_result
          type: executed_as
    - name: synthesize_answer
      kind: Behavior
      on: [sql.executed]
      creates: [answer]
      emits: [answer.created]
      relations_created:
        - source: answer
          target: query_result
          type: derived_from

object_model:
  object_types:
    - type: question
      data_fields:
        text: string
        language: string
    - type: intent
      data_fields:
        kind: string
        entity: string
        filters: object
        requested_fields: list
    - type: sql_query
      data_fields:
        sql: string
        params: list
        statement_type: string
        status: string
        answer_template: string
    - type: query_result
      data_fields:
        rows: list
        row_count: integer
    - type: answer
      data_fields:
        text: string
        citations: list
  relation_types:
    - type: derived_from
      examples:
        - "intent -> question"
        - "sql_query -> intent"
        - "answer -> query_result"
    - type: executed_as
      examples:
        - "sql_query -> query_result"

canonical_success_flow:
  prompt: "의사는 모두 몇명이야?"
  expected_answer: "의사는 모두 5명입니다."
  expected_sql: "SELECT COUNT(*) FROM doctors"
  expected_rows: [[5]]
  expected_event_sequence:
    - question.submitted
    - behavior.started
    - object.created
    - object.created
    - relation.created
    - intent.created
    - behavior.completed
    - behavior.started
    - object.created
    - relation.created
    - sql.generated
    - behavior.completed
    - behavior.started
    - object.created
    - relation.created
    - patch.applied
    - sql.executed
    - behavior.completed
    - behavior.started
    - object.created
    - relation.created
    - answer.created
    - behavior.completed
    - runtime.idle
  expected_graph_counts:
    events: 24
    objects: 5
    relations: 4

canonical_failure_flow:
  prompt: "의사는 모두 몇명?"
  current_result: unsupported_prompt
  expected_event_sequence:
    - question.submitted
    - behavior.started
    - behavior.failed
    - runtime.idle
  expected_graph_counts:
    events: 4
    objects: 0
    relations: 0
  improvement_target:
    file: "activegraph/text-to-sql-agent/src/cli/text_to_sql.py"
    function: deterministic_plan
    likely_change: "Broaden doctor-count Korean expression matching."

evaluation:
  current_cases_file: "activegraph/text-to-sql-agent/evals/hospital_cases.jsonl"
  current_expected_result:
    passed: 2
    failed: 0
  commands:
    eval: "python activegraph/text-to-sql-agent/agent.py text-to-sql eval"
    inspect_latest: "python activegraph/text-to-sql-agent/agent.py text-to-sql inspect 0"
  tdd_policy:
    - "Add failing JSONL case before changing planner/behavior rules."
    - "Run eval after each behavior change."
    - "Inspect failed run before editing behavior code."

observability:
  primary:
    text_to_sql_inspect:
      command: "python activegraph/text-to-sql-agent/agent.py text-to-sql inspect 0"
      shows:
        - before behaviors
        - after objects
        - after relations
        - recent events
        - behavior failures
  generic_activegraph:
    inspect: "python activegraph/text-to-sql-agent/agent.py inspect <store_url> --run-id <run_id> --tail 8"
    replay: "python activegraph/text-to-sql-agent/agent.py replay <store_url> --run-id <run_id>"
    export_trace: "python activegraph/text-to-sql-agent/agent.py export-trace <store_url> --run-id <run_id> --format jsonl"
  artifact_files:
    trace_jsonl: ".tests/runs/<run_id>/trace.jsonl"
    graph_json: ".tests/runs/<run_id>/graph.json"

safety_and_constraints:
  sql_policy:
    allowed: "Single SELECT statement only."
    blocked_tokens:
      - insert
      - update
      - delete
      - drop
      - alter
      - create
      - attach
      - pragma
    semicolon_allowed: false
  write_policy:
    hospital_db: "read-only during query execution"
    event_store: "append-only ActiveGraph event log"
    artifacts: "debug snapshots under .tests/runs"
  deterministic_baseline:
    reason: "Keep replay/eval stable before adding LLM nondeterminism."

incremental_roadmap:
  v00_current:
    - "Local agent.py REPL with text-to-sql and activegraph modes."
    - "Deterministic behavior-backed Text-to-SQL over hospital.db."
    - "SQLite event-store logging and run inspection."
  v01_prompt_coverage:
    - "Add failing cases for Korean count phrasing variants."
    - "Replace marker list with regex or small grammar for count/lookups."
    - "Add inspect output focused on failed behavior payloads."
  v02_system_model_runtime:
    - "Load behavior settings from this system-model YAML or derived config."
    - "Separate hospital-specific schema from generic Text-to-SQL runtime."
    - "Allow alternate DB packs such as techshop via env/config."
  v03_llm_adapter:
    - "Introduce optional OpenAI-compatible planner behind deterministic fallback."
    - "Persist prompt assembly and model response events."
    - "Keep LLM adapter injectable, not a core dependency."
  v04_kb_integration:
    - "Add OKF/llm-wiki ingestion experiment with approval-gated writes."
    - "Model KB pages and index.md as external environment projection targets."
  v05_pack_and_skill_generation:
    - "Generate SKILL.md and pack metadata from system-model specs when behavior surface stabilizes."

open_questions:
  - id: system_model_loader
    question: "Should agent.py read this YAML directly, or should a build step generate runtime config/code from it?"
    current_decision: "v00 is documentation/spec capture only."
  - id: event_store_default
    question: "Should event store path move into .env/pack config?"
    current_decision: "Default hardcoded path is acceptable for v00 experiment."
  - id: prompt_matching_strategy
    question: "Should deterministic_plan use regex, parser, or table-driven declarative rules next?"
    current_decision: "Add failing eval cases first, then choose the smallest rule upgrade."
  - id: replay_strictness
    question: "When LLM adapters arrive, how strict should replay be?"
    current_decision: "Keep v00 deterministic; revisit with recorded llm.responded events."
